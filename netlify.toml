[build]
  publish = "site"

[[redirects]]
  from = "/projects"
  to = "/all-projects/"
  status = 301
  force = true

[[redirects]]
  from = "/projects/*"
  to = "/all-projects/"
  status = 301
  force = true

[[redirects]]
  from = "/lab"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/lab/*"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
