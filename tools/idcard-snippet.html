<style id="id-card-css">
#id-card-btn,#id-card-back{display:none}
@media (max-width:900px){
  #id-card-zone{display:none!important}
  #id-card{left:50%!important;margin-left:-405px;width:810px!important;height:560px!important;top:60px!important;transform-origin:50% 0}
  #id-card-btn{display:flex;align-items:center;gap:8px;position:absolute;top:70px;right:16px;z-index:7;padding:9px 13px;border:1px solid rgba(232,217,200,.35);border-radius:999px;background:rgba(5,6,9,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#e8d9c8;font:600 11px/1 "Plus Jakarta Sans Variable","Plus Jakarta Sans",system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;-webkit-tap-highlight-color:transparent}
  #id-card-btn i{display:block;width:6px;height:6px;border-right:1.5px solid #f94137;border-bottom:1.5px solid #f94137;transform:rotate(45deg) translateY(-2px);transition:transform .3s}
  #id-card-btn[aria-expanded="true"] i{transform:rotate(-135deg) translateY(-2px)}
  #id-card-back{position:fixed;inset:0;z-index:4;background:rgba(5,6,9,.55)}
  #id-card-back.on{display:block}
}
</style><div id="id-card-wrap" style="position:absolute;top:0;left:0;width:100%;height:0;overflow-x:clip;overflow-y:visible;pointer-events:none;z-index:5"><iframe id="id-card" title="ID card" scrolling="no" allowtransparency="true" data-src="/hero/" style="position:absolute;top:0;left:max(0px,calc(78vw - 405px));width:min(810px,100vw);height:min(560px,75vh);border:0;background:transparent;z-index:5;clip-path:inset(0 140px);pointer-events:none;transform:translateY(-820px) scale(1.35);transform-origin:50% 0;transition:transform .6s cubic-bezier(.16,1,.3,1)"></iframe></div><div id="id-card-zone" style="position:absolute;top:52px;left:calc(max(0px,calc(78vw - 405px)) + 135px);width:540px;height:280px;z-index:6"></div><div id="id-card-back"></div><button id="id-card-btn" type="button" aria-expanded="false" aria-controls="id-card">ID card<i></i></button><script id="id-card-peek">(function(){
var f=document.getElementById('id-card'),z=document.getElementById('id-card-zone'),btn=document.getElementById('id-card-btn'),back=document.getElementById('id-card-back');
if(!f||!z)return;
var open=false,tIn,tOut,tAuto,lock=0,loaded=false,
    reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches,
    small=function(){return window.innerWidth<=900};
// the card art itself is about 196px wide at scale 1: make it ~72% of the screen width on phones
function sc(){return small()?Math.min(1.5,Math.max(.9,window.innerWidth*.72/196)):1.35}
function rest(){return small()?'translateY('+(-(560*sc()+140))+'px) scale('+sc()+')':'translateY(-820px) scale(1.35)'}
function opened(){return 'translateY(0) scale('+sc()+')'}
function load(){if(loaded){try{f.contentWindow.location.reload()}catch(e){}return}loaded=true;f.src=f.getAttribute('data-src')}
function show(){if(open||Date.now()<lock)return;open=true;clearTimeout(tOut);load();
  f.style.pointerEvents='auto';f.style.transform=opened();
  if(small()){btn.setAttribute('aria-expanded','true');back.classList.add('on');clearTimeout(tAuto);tAuto=setTimeout(hide,5500)}}
function hide(){if(!open)return;open=false;lock=Date.now()+800;clearTimeout(tAuto);
  f.style.pointerEvents='none';f.style.transform=rest();
  btn.setAttribute('aria-expanded','false');back.classList.remove('on')}
f.style.transform=rest();
// desktop: warm the card up shortly after load so the first hover is instant (phones wait for the first tap)
if(!small())window.addEventListener('load',function(){setTimeout(function(){if(!loaded){loaded=true;f.src=f.getAttribute('data-src')}},1500)});
if(reduce)f.style.transition='none';
// desktop: hover the zone
z.addEventListener('mouseenter',function(){clearTimeout(tIn);tIn=setTimeout(show,150)});
z.addEventListener('mouseleave',function(){clearTimeout(tIn);if(open){clearTimeout(tOut);tOut=setTimeout(hide,600)}});
f.addEventListener('mouseenter',function(){if(!small())clearTimeout(tOut)});
f.addEventListener('mouseleave',function(){if(!small()){clearTimeout(tOut);tOut=setTimeout(hide,600)}});
// phone: tap the button (taps, not scrolls); tap anywhere else to close
btn.addEventListener('click',function(){open?hide():show()});
back.addEventListener('click',hide);
window.addEventListener('scroll',function(){if(open&&small()&&Math.abs(window.scrollY)>120)hide()},{passive:true});
window.addEventListener('resize',function(){f.style.transform=open?opened():rest()});
// one friendly peek per visit on phones, once the page has settled
if(small()&&!reduce){try{if(!sessionStorage.getItem('idPeek')){sessionStorage.setItem('idPeek','1');setTimeout(function(){if(window.scrollY<40)show()},2200)}}catch(e){}}
})();</script>
